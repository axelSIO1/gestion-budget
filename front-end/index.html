<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GpasdeTal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>GpasdeTal</h1>

    <table id="tableTransactions">
        <thead>
            <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Catégorie</th>
                <th>Montant</th>
                <th>Type</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="corpsTableau"></tbody>
    </table>

    <h2>Ajouter une transaction</h2>
    <form id="formAjout">
        <input type="number" id="montant" placeholder="Montant" step="0.01" required>
        <input type="date" id="date" required>
        <input type="text" id="description" placeholder="Description">
        <select id="type">
            <option value="depense">Dépense</option>
            <option value="revenu">Revenu</option>
        </select>
        <input type="number" id="idCategorie" placeholder="ID Catégorie" required>
        <button type="submit">Ajouter</button>
    </form>

    <script>
        const API_URL = "http://localhost:8080/api/transactions";

        // Récupère et affiche les transactions
        async function chargerTransactions() {
            const reponse = await fetch(API_URL);
            const transactions = await reponse.json();

            const corps = document.getElementById("corpsTableau");
            corps.innerHTML = "";

            transactions.forEach(t => {
                const ligne = document.createElement("tr");
                ligne.innerHTML = `
                    <td>${t.date}</td>
                    <td>${t.description ?? ""}</td>
                    <td>${t.idCategorie}</td>
                    <td class="${t.type}">${t.montant.toFixed(2)} €</td>
                    <td>${t.type}</td>
                    <td><button onclick="supprimerTransaction(${t.id})">Supprimer</button></td>
                `;
                corps.appendChild(ligne);
            });
        }

        // Ajoute une transaction
        document.getElementById("formAjout").addEventListener("submit", async (e) => {
            e.preventDefault();

            const nouvelleTransaction = {
                montant: parseFloat(document.getElementById("montant").value),
                date: document.getElementById("date").value,
                description: document.getElementById("description").value,
                type: document.getElementById("type").value,
                idUtilisateur: 1,
                idCategorie: parseInt(document.getElementById("idCategorie").value)
            };

            await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(nouvelleTransaction)
            });

            document.getElementById("formAjout").reset();
            chargerTransactions();
        });

        // Supprime une transaction
        async function supprimerTransaction(id) {
            await fetch(`${API_URL}/${id}`, { method: "DELETE" });
            chargerTransactions();
        }

        // Chargement initial
        chargerTransactions();
    </script>

</body>
</html>
